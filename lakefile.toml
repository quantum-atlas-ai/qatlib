name = "Qatlib"
defaultTargets = ["Qatlib"]
enableArtifactCache = true
platformIndependent = true
lintDriver = "lint"
testDriver = "test"

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Qatlib"

[[lean_exe]]
name = "get_cache"
srcDir = "scripts"

[[lean_exe]]
name = "lint"
srcDir = "scripts"

[[lean_exe]]
name = "test"
srcDir = "scripts"
supportInterpreter = true
