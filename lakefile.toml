name = "Qatlib"
defaultTargets = ["Qatlib"]
platformIndependent = true
allowNonModules = true
lintDriver = "lint"
testDriver = "test"

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Qatlib"
requiresModuleSystem = true

[[lean_lib]]
name = "QatlibTests"
srcDir = "verification"
requiresModuleSystem = true
globs = ["QatlibTests", "QatlibTests.+"]
leanOptions = { warningAsError = true }

[[lean_exe]]
name = "get_cache"
srcDir = "scripts"

[[lean_exe]]
name = "lint"
srcDir = "scripts"

[[lean_exe]]
name = "test"
srcDir = "scripts"
supportInterpreter = true
