name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - 'scripts/build_site.py'
      - '.github/assets/**'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-docs:
    name: Build API Docs (doc-gen4)
    concurrency:
      group: docs-build
      cancel-in-progress: true
    if: >-
      (github.event_name == 'push' && vars.QATLIB_SKIP_DOCS != 'true') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && vars.QATLIB_SKIP_DOCS != 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
      LEAN_NUM_THREADS: ${{ vars.QATLIB_DOCS_THREADS || '2' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}

      - name: Install elan
        run: |
          set -o pipefail
          if command -v lean >/dev/null 2>&1 && command -v lake >/dev/null 2>&1; then
            lean --version
            lake --version
            exit 0
          fi
          ELAN_VERSION="v4.1.2"
          ELAN_SHA256="4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264"
          ELAN_SCRIPT="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/leanprover/elan/$ELAN_VERSION/elan-init.sh" \
            --output "$ELAN_SCRIPT"
          printf '%s  %s\n' "$ELAN_SHA256" "$ELAN_SCRIPT" | sha256sum --check --strict
          sh "$ELAN_SCRIPT" --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Free runner disk space and configure swap
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ ! -f /ci-swapfile ]; then
            sudo fallocate -l 24G /ci-swapfile || sudo dd if=/dev/zero of=/ci-swapfile bs=1M count=24576
            sudo chmod 600 /ci-swapfile
            sudo mkswap /ci-swapfile
            sudo swapon /ci-swapfile
          fi
          sudo sysctl -w vm.overcommit_memory=1 || true
          df -h
          free -h

      - name: Fetch precompiled cache (Mathlib, Physlib, Qatlib)
        run: |
          set -euo pipefail
          lake exe get_cache --no-qatlib
          TC_DIR="$(sed -e 's|/|--|g' -e 's|:|---|g' < lean-toolchain | tr -d '[:space:]')"
          REPO_SLUG="quantum-atlas-ai/qatlib"
          INPUT_TREE="$(git rev-parse HEAD:Qatlib HEAD:Qatlib.lean HEAD:lakefile.toml HEAD:lean-toolchain HEAD:lake-manifest.json | sha256sum | cut -d' ' -f1)"
          CANDIDATE="$RUNNER_TEMP/qatlib-docs-outputs.jsonl"
          FOUND="false"
          BASE="https://lake-cache.quantum-atlas.ai/revisions/$REPO_SLUG/tc/$TC_DIR"
          manifest_has_entries() {
            python3 - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          lines = [line.strip() for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()]
          rows = []
          for line in lines[1:]:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(row, list) and len(row) >= 2 and isinstance(row[0], str) and row[0]:
                  rows.append(row)
          raise SystemExit(0 if rows else 1)
          PY
          }
          for attempt in $(seq 1 36); do
            if curl --connect-timeout 10 --max-time 30 -fsSL -H "User-Agent: LakeCache/4.35.0" "$BASE/$TARGET_SHA.jsonl" -o "$CANDIDATE" 2>/dev/null && manifest_has_entries "$CANDIDATE"; then FOUND="true"; break; fi
            if curl --connect-timeout 10 --max-time 30 -fsSL -H "User-Agent: LakeCache/4.35.0" "$BASE/inputs/$INPUT_TREE.jsonl" -o "$CANDIDATE" 2>/dev/null && manifest_has_entries "$CANDIDATE"; then FOUND="true"; break; fi
            echo "Waiting for Cache workflow to finish publishing the exact Qatlib R2 manifest (attempt $attempt/36)..."
            sleep 10
          done
          if [ "$FOUND" != "true" ]; then
            echo "Error: Prebuilt Qatlib R2 manifest not found for $TARGET_SHA (input_tree=$INPUT_TREE)." >&2
            exit 1
          fi
          TMP_CURL="$(mktemp -d "$RUNNER_TEMP/curlrc.XXXXXX")"
          trap 'rm -rf "$TMP_CURL"' EXIT
          printf 'connect-timeout = 15\nspeed-time = 20\nspeed-limit = 1024\nretry = 3\nretry-delay = 1\n' > "$TMP_CURL/.curlrc"
          LAKE_CONFIG="${{ github.workspace }}/lake-cache.toml" CURL_HOME="$TMP_CURL" lake cache get "$CANDIDATE" --package=Qatlib --repo="$REPO_SLUG"

      - name: Verify prebuilt Qatlib cache is complete (never compile Qatlib in Docs)
        run: |
          set -euo pipefail
          if ! lake --no-build build Qatlib > "$RUNNER_TEMP/nobuild.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/nobuild.log"
            exit 1
          fi

      - name: Restore cached doc-gen4 database and markers
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-data
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/leansqlite/.lake/build
            .lake/packages/Cli/.lake/build
          key: docgen4-db-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json', 'docs/references.bib') }}-${{ env.TARGET_SHA }}
          restore-keys: |
            docgen4-db-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json', 'docs/references.bib') }}-
            docgen4-db-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Configure docbuild subproject and build Qatlib:docs
        run: |
          set -euo pipefail
          TC_TAG="$(sed 's/.*://' lean-toolchain | tr -d '[:space:]')"
          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "${TC_TAG}"

          [[require]]
          name = "Qatlib"
          path = ".."
          EOF
          cp lean-toolchain docbuild/lean-toolchain
          if [ -f docs/references.bib ]; then
            mkdir -p docbuild/docs
            cp docs/references.bib docbuild/docs/references.bib
          fi
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update doc-gen4
          rm -rf .lake/build/doc .lake/build/doc-data/*.docs_built* .lake/build/doc-data/*docsHeader_built* \
            .lake/build/doc-data/declaration-data-*.bmp* .lake/build/doc-data/backrefs-*.json*
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          core, live = {"Init", "Std", "Lake", "Lean"}, set()
          for d in [Path("../.lake/build/lib/lean"), *Path("../.lake/packages").glob("*/.lake/build/lib/lean")]:
              if d.is_dir():
                  live |= {".".join(p.relative_to(d).with_suffix("").parts) for p in d.rglob("*.olean")}
          ok = lambda m: m.split(".", 1)[0] in core or m in live
          doc_data, db = Path(".lake/build/doc-data"), Path(".lake/build/api-docs.db")
          for p in (doc_data.glob("*.doc") if doc_data.is_dir() else []):
              if not p.stem.startswith("core-") and not ok(p.stem):
                  for q in doc_data.glob(f"{p.stem}.doc*"): q.unlink(missing_ok=True)
          if db.is_file():
              with sqlite3.connect(db, timeout=30) as c:
                  c.execute("PRAGMA foreign_keys = ON")
                  stale = [(n,) for (n,) in c.execute("SELECT name FROM modules") if not ok(n)]
                  if stale: c.executemany("DELETE FROM modules WHERE name = ?", stale)
                  c.commit()
                  c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          PY
          run_docgen() {
            echo "=== [1/2] Building doc-gen4 and Lean coreDocs sequentially (LEAN_NUM_THREADS=1) ===" &&
            LEAN_NUM_THREADS=1 DISABLE_EQUATIONS=1 DOCGEN_SRC="github" \
              lake build @doc-gen4/coreDocs > "$RUNNER_TEMP/docgen.log" 2>&1 &&
            echo "=== [2/2] Building Qatlib:docs (LEAN_NUM_THREADS=${LEAN_NUM_THREADS}) ===" &&
            DISABLE_EQUATIONS=1 DOCGEN_SRC="github" \
              lake build Qatlib:docs >> "$RUNNER_TEMP/docgen.log" 2>&1
          }
          if ! run_docgen; then
            if grep -q "Database schema is outdated" "$RUNNER_TEMP/docgen.log"; then
              echo "Detected doc-gen4 schema update; resetting api-docs.db and rebuilding cleanly..."
              rm -rf .lake/build/api-docs.db* .lake/build/doc-data .lake/build/doc
              if ! run_docgen; then
                tail -n 100 "$RUNNER_TEMP/docgen.log"
                exit 1
              fi
            else
              tail -n 100 "$RUNNER_TEMP/docgen.log"
              exit 1
            fi
          fi
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path(".lake/build/api-docs.db")
          if db.is_file():
              with sqlite3.connect(db, timeout=30) as c:
                  c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          PY

      - name: Assemble Qatlib documentation portal and API reference
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --quiet markdown-it-py
          "$RUNNER_TEMP/site-venv/bin/python" scripts/build_site.py \
            --repo-root . \
            --docgen-dir docbuild/.lake/build/doc \
            --move-docgen \
            --out-dir _site \
            --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: vars.QATLIB_SKIP_PAGES != 'true'
    needs: build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
