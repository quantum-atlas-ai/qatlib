name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'README*'
      - 'CONTRIBUTING*'
      - 'CITATION.cff'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '!docs/references.bib'
      - 'scripts/README*'
      - 'scripts/build_site.py'
      - '.github/assets/**'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Mixed portal/Lean commits are handled only by workflow_run. Serialize the
# remaining events without cancelling a successful analysis/upload in flight.
concurrency:
  group: docs-main
  cancel-in-progress: false

jobs:
  select:
    if: >-
      (github.event_name == 'push' && vars.QATLIB_SKIP_DOCS != 'true') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && vars.QATLIB_SKIP_DOCS != 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.QATLIB_LIGHT_RUNNERS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: docs-select
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs-select
          fetch-depth: 0
          clean: false
          persist-credentials: false
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}
      - id: select
        name: Route mixed commits through Build completion
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import fnmatch, os, subprocess
          # Keep this list aligned with Build's push paths (covered by tests).
          patterns = ('Qatlib/**', 'Qatlib.lean', 'verification/**',
                      'lakefile.toml', 'lean-toolchain',
                      'lake-manifest.json', 'lake-cache.toml', 'scripts/*.lean',
                      'scripts/complete_outputs.py', 'scripts/build_docs.sh',
                      'scripts/docs_cache.py', 'scripts/test_docs_pipeline.py',
                      'docbuild/**', 'docs/references.bib',
                      '.github/workflows/build.yml', '.github/workflows/publish-cache.yml')
          run = True
          if os.environ['EVENT_NAME'] == 'push':
              changed = subprocess.check_output([
                  'git', 'diff', '--name-only', os.environ['BEFORE'], os.environ['AFTER']
              ], text=True).splitlines()
              run = not any(fnmatch.fnmatchcase(p, glob) for p in changed for glob in patterns)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(run).lower()}\n')
          PY

  build-docs:
    name: Build API Docs (doc-gen4)
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.QATLIB_DOCS_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    defaults:
      run:
        working-directory: docs-work
    env:
      LEAN_NUM_THREADS: ${{ vars.QATLIB_DOCS_THREADS || '2' }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: docs-work
          fetch-depth: 0
          clean: false
          persist-credentials: false
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}

      - name: Prepare isolated Docs cache and Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --quiet markdown-it-py==4.0.0 trash-cli==0.24.5.26
          echo "$RUNNER_TEMP/docs-venv/bin" >> "$GITHUB_PATH"
          # Build's git clean cannot remove this Docs-only dependency cache.
          LOCK="$(sha256sum lean-toolchain lake-manifest.json docbuild/lake-manifest.json | sha256sum | cut -d' ' -f1)"
          DOCS_CACHE="${RUNNER_TOOL_CACHE:-$HOME/.cache}/qatlib-docs/$LOCK"
          mkdir -p "$DOCS_CACHE/packages" "$DOCS_CACHE/artifacts" .lake
          if [ -e .lake/packages ] && [ ! -L .lake/packages ]; then
            "$RUNNER_TEMP/docs-venv/bin/trash-put" .lake/packages
          fi
          ln -sfn "$DOCS_CACHE/packages" .lake/packages
          echo "DOCS_PACKAGE_CACHE=$DOCS_CACHE" >> "$GITHUB_ENV"
          echo "LAKE_CACHE_DIR=$DOCS_CACHE/artifacts" >> "$GITHUB_ENV"

      - name: Restore exact raw doc-gen4 HTML from R2 before installing Lean
        id: html
        run: python3 scripts/docs_cache.py probe

      - name: Install elan on analysis cache miss
        if: steps.html.outputs.hit != 'true'
        run: |
          set -euo pipefail
          if command -v lean >/dev/null 2>&1 && command -v lake >/dev/null 2>&1; then
            lean --version
            lake --version
            exit 0
          fi
          ELAN_VERSION="v4.1.2"
          ELAN_SHA256="4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264"
          ELAN_SCRIPT="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/leanprover/elan/$ELAN_VERSION/elan-init.sh" \
            --output "$ELAN_SCRIPT"
          printf '%s  %s\n' "$ELAN_SHA256" "$ELAN_SCRIPT" | sha256sum --check --strict
          sh "$ELAN_SCRIPT" --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate incrementally and publish snapshots when credentials are available
        if: steps.html.outputs.hit != 'true'
        env:
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: bash scripts/build_docs.sh

      - name: Assemble and verify the documentation portal without modifying raw HTML
        run: |
          python3 scripts/build_site.py --repo-root . \
            --docgen-dir docbuild/.lake/build/doc --out-dir _site --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-work/_site

  deploy:
    name: Deploy to GitHub Pages
    if: vars.QATLIB_SKIP_PAGES != 'true'
    needs: build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
