name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qatlib-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and kernel audit
    runs-on: ${{ fromJSON(vars.QATLIB_BUILD_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    env:
      LAKE_ARTIFACT_CACHE: "true"
      LEAN_ABORT_ON_PANIC: "1"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - name: Configure cache directory and build threads
        env:
          CI_THREADS: ${{ vars.QATLIB_CI_THREADS }}
        run: |
          set -euo pipefail
          if [ -z "${LAKE_CACHE_DIR:-}" ]; then
            echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache" >> "$GITHUB_ENV"
          fi
          THREADS="${CI_THREADS:-${LEAN_NUM_THREADS:-1}}"
          case "$THREADS" in
            ''|*[!0-9]*) echo "LEAN_NUM_THREADS must be a positive integer"; exit 1 ;;
          esac
          test "$THREADS" -gt 0
          echo "LEAN_NUM_THREADS=$THREADS" >> "$GITHUB_ENV"
          printf 'LEAN_NUM_THREADS=%s\n' "$THREADS"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}

      - name: Compute cache scope and find a read-only R2 mapping candidate
        id: check_r2
        run: |
          set -euo pipefail
          TC_DIR="$(sed -e 's|/|--|g' -e 's|:|---|g' < lean-toolchain | tr -d '[:space:]')"
          TC_LEGACY="$(sed -e 's|/|-|g' -e 's|:|-|g' < lean-toolchain | tr -d '[:space:]')"
          REPO_SLUG="quantum-atlas-ai/qatlib"
          LEGACY_SCOPE="qatlib-main/$TC_LEGACY/qatlib"
          INPUT_TREE="$(git rev-parse HEAD:Qatlib HEAD:Qatlib.lean HEAD:lakefile.toml HEAD:lean-toolchain HEAD:lake-manifest.json | sha256sum | cut -d' ' -f1)"
          echo "CACHE_REPO=$REPO_SLUG" >> "$GITHUB_ENV"
          echo "CACHE_SCOPE=$REPO_SLUG/tc/$TC_DIR" >> "$GITHUB_ENV"
          echo "CACHE_LEGACY_SCOPE=$LEGACY_SCOPE" >> "$GITHUB_ENV"
          echo "INPUT_TREE=$INPUT_TREE" >> "$GITHUB_ENV"
          CDN_BASE="https://lake-cache.quantum-atlas.ai/revisions/$REPO_SLUG/tc/$TC_DIR"
          LEGACY_BASE="https://lake-cache.quantum-atlas.ai/revisions/$LEGACY_SCOPE"
          CANDIDATE="$RUNNER_TEMP/qatlib-cached-inputs.jsonl"
          echo "mapping=$CANDIDATE" >> "$GITHUB_OUTPUT"
          FOUND="false"
          HIT_KIND="none"
          MODE="repo"
          for BASE in "$CDN_BASE" "$LEGACY_BASE"; do
            if [ "$BASE" = "$LEGACY_BASE" ]; then MODE="scope"; fi
            for KEY in "${{ github.sha }}.jsonl" "inputs/$INPUT_TREE.jsonl" $(git rev-list --max-count=25 HEAD~1 2>/dev/null || true); do
              REQUEST_KEY="$KEY"
              case "$KEY" in
                inputs/*|*.jsonl) ;;
                *) REQUEST_KEY="$KEY.jsonl" ;;
              esac
              if curl --connect-timeout 10 --max-time 30 -fsSL -H "User-Agent: LakeCache/4.35.0" "$BASE/$REQUEST_KEY" -o "$CANDIDATE" 2>/dev/null && [ -s "$CANDIDATE" ]; then
                FOUND="true"
                case "$KEY" in inputs/*|"${{ github.sha }}.jsonl") HIT_KIND="exact";; *) HIT_KIND="ancestor";; esac
                echo "cache_mode=$MODE" >> "$GITHUB_OUTPUT"
                break 2
              fi
            done
          done
          if [ "$FOUND" = "true" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
          echo "hit_kind=$HIT_KIND" >> "$GITHUB_OUTPUT"

      - name: Install elan
        run: |
          set -o pipefail
          if command -v lean >/dev/null 2>&1 && command -v lake >/dev/null 2>&1; then
            lean --version
            lake --version
            exit 0
          fi
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run static source, style, and layer checks
        run: lake lint

      - name: Free runner disk space and configure swap
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ ! -f /ci-swapfile ]; then
            sudo fallocate -l 16G /ci-swapfile || sudo dd if=/dev/zero of=/ci-swapfile bs=1M count=16384
            sudo chmod 600 /ci-swapfile
            sudo mkswap /ci-swapfile
            sudo swapon /ci-swapfile
          fi
          df -h
          free -h
          nproc

      - name: Fetch Mathlib, Physlib, and Qatlib caches
        run: |
          set -euo pipefail
          mkdir -p "$LAKE_CACHE_DIR"
          fetch() {
            lake exe get_cache --no-qatlib
            if [ "${{ steps.check_r2.outputs.found }}" = "true" ]; then
              TMP_CURL="$(mktemp -d "$RUNNER_TEMP/curlrc.XXXXXX")"
              trap 'rm -rf "$TMP_CURL"' RETURN
              printf 'connect-timeout = 15\nspeed-time = 20\nspeed-limit = 1024\nretry = 3\nretry-delay = 1\n' > "$TMP_CURL/.curlrc"
              if [ "${{ steps.check_r2.outputs.cache_mode }}" = "repo" ]; then
                LAKE_CONFIG="${{ github.workspace }}/lake-cache.toml" CURL_HOME="$TMP_CURL" lake cache get "${{ steps.check_r2.outputs.mapping }}" --package=Qatlib --repo="$CACHE_REPO"
              else
                LAKE_CONFIG="${{ github.workspace }}/lake-cache.toml" CURL_HOME="$TMP_CURL" lake cache get "${{ steps.check_r2.outputs.mapping }}" --package=Qatlib --scope="$CACHE_LEGACY_SCOPE"
              fi
            fi
          }
          if command -v flock >/dev/null 2>&1; then flock "$LAKE_CACHE_DIR/.fetch.lock" -c "$(declare -f fetch); fetch"; else fetch; fi

      - name: Materialize cached artifacts and build Qatlib incrementally
        id: build
        run: |
          set -euo pipefail
          mkdir -p .lake
          if [ "${{ steps.check_r2.outputs.hit_kind }}" = "exact" ] && lake --no-build build -KCI Qatlib > "$RUNNER_TEMP/nobuild.log" 2>&1; then
            echo "All Qatlib artifacts materialized from R2 cache; reusing verified mapping without leantar repacking."
            cp "${{ steps.check_r2.outputs.mapping }}" .lake/outputs.jsonl
          else
            if [ "${{ steps.check_r2.outputs.found }}" = "true" ]; then
              python3 - "${{ steps.check_r2.outputs.mapping }}" "$LAKE_CACHE_DIR/artifacts" .lake/build <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          mapping, arts_dir, build_dir = map(Path, sys.argv[1:])
          rows = [json.loads(l) for l in mapping.read_text().splitlines()[1:] if l.strip()]
          ltars = {k: v for k, v, *_ in rows if isinstance(v, str) and v.endswith(".ltar") and Path(v).name == v}
          lean_dir = build_dir / "lib" / "lean"
          for trace in lean_dir.rglob("*.trace"):
              ltar = ltars.get(json.loads(trace.read_text()).get("depHash"))
              src, dst = (arts_dir / ltar if ltar else None), build_dir / "ir" / trace.relative_to(lean_dir).with_suffix(".ltar")
              if src and src.is_file() and not dst.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  try: os.link(src, dst)
                  except OSError: shutil.copy2(src, dst)
          PY
            fi
            if ! lake build -KCI Qatlib -o .lake/outputs.jsonl > "$RUNNER_TEMP/build.log" 2>&1; then
              tail -n 100 "$RUNNER_TEMP/build.log"
              exit 1
            fi
          fi
          test -s .lake/outputs.jsonl

      - name: Run kernel soundness and transitive axiom audit
        id: audit
        run: lake exe test

      - name: Stage delta cache bundle for Cache workflow
        id: stage_delta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.build.outcome == 'success' && steps.audit.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf cache-staging
          mkdir -p cache-staging
          cp .lake/outputs.jsonl cache-staging/full-outputs.jsonl
          head -n 1 .lake/outputs.jsonl > .lake/delta.jsonl
          if [ "${{ steps.check_r2.outputs.found }}" = "true" ]; then
            comm -23 <(tail -n +2 .lake/outputs.jsonl | sort -u) <(tail -n +2 "${{ steps.check_r2.outputs.mapping }}" | sort -u) >> .lake/delta.jsonl
          else
            tail -n +2 .lake/outputs.jsonl >> .lake/delta.jsonl
          fi
          DELTA_COUNT=$(( $(wc -l < .lake/delta.jsonl) - 1 ))
          echo "Delta artifact entries to stage: $DELTA_COUNT"
          if [ "$DELTA_COUNT" -gt 0 ]; then
            lake cache stage .lake/delta.jsonl cache-staging
            HAS_DELTA="true"
          else
            HAS_DELTA="false"
          fi
          python3 - "${{ github.sha }}" "$CACHE_SCOPE" "$INPUT_TREE" "$HAS_DELTA" cache-staging/metadata.json <<'PY'
          import json, sys
          from pathlib import Path
          sha, scope, input_tree, has_delta, out = sys.argv[1:]
          Path(out).write_text(json.dumps({
              "sha": sha,
              "scope": scope,
              "input_tree": input_tree,
              "has_delta": has_delta == "true",
          }, indent=2) + "\n")
          PY

      - name: Upload delta cache bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.stage_delta.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qatlib-cache-delta-${{ github.sha }}
          path: cache-staging
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
