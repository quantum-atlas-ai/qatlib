name: Update Lean Project

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update_lean:
    name: Check Upstream Mathlib & Physlib Releases
    if: github.repository == 'quantum-atlas-ai/qatlib' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check latest shared Lean release across Mathlib and Physlib
        id: check_upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_TAG="$(sed 's/.*://' lean-toolchain | tr -d '[:space:]')"
          echo "Current toolchain tag: $CURRENT_TAG"

          MATHLIB_TAGS="$(gh api --paginate 'repos/leanprover-community/mathlib4/tags?per_page=100' --jq '.[].name' | grep -E '^v4\.[0-9]+\.[0-9]+$' | sort -u)"
          PHYSLIB_TAGS="$(gh api --paginate 'repos/leanprover-community/Physlib/tags?per_page=100' --jq '.[].name' | grep -E '^v4\.[0-9]+\.[0-9]+$' | sort -u)"

          LATEST_SHARED="$(comm -12 <(echo "$MATHLIB_TAGS") <(echo "$PHYSLIB_TAGS") | sort -V | tail -n 1)"
          echo "Latest shared Mathlib + Physlib release tag: $LATEST_SHARED"
          echo "latest_tag=$LATEST_SHARED" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_SHARED" ] || [ "$LATEST_SHARED" = "$CURRENT_TAG" ]; then
            echo "Already on latest shared upstream release ($CURRENT_TAG)."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release available: $CURRENT_TAG -> $LATEST_SHARED"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan and update manifest
        if: steps.check_upstream.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.check_upstream.outputs.latest_tag }}"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          export PATH="$HOME/.elan/bin:$PATH"
          echo "leanprover/lean4:${NEW_TAG}" > lean-toolchain
          sed -i -E "s/rev = \"v4\.[0-9]+\.[0-9]+\"/rev = \"${NEW_TAG}\"/g" lakefile.toml
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update

      - name: Open Pull Request for toolchain update
        if: steps.check_upstream.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore(deps): bump Lean, Mathlib, and Physlib to ${{ steps.check_upstream.outputs.latest_tag }}"
          body: |
            Automated weekly check detected a newer upstream release shared by `mathlib4` and `Physlib`: **`${{ steps.check_upstream.outputs.latest_tag }}`**.

            - Updated `lean-toolchain` to `leanprover/lean4:${{ steps.check_upstream.outputs.latest_tag }}`
            - Updated `lakefile.toml` and `lake-manifest.json`
          branch: chore/lean-update-${{ steps.check_upstream.outputs.latest_tag }}
          delete-branch: true
