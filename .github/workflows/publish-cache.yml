name: Cache

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: qatlib-cache-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish-cache:
    name: Publish verified delta cache to Cloudflare R2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ fromJSON(vars.QATLIB_LIGHT_RUNNERS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check whether LAKE_CACHE_KEY is configured
        id: upload_gate
        env:
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          set -euo pipefail
          KEY="$(printf %s "$LAKE_CACHE_KEY_RAW" | sed -e 's/[[:space:]]*$//')"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No LAKE_CACHE_KEY configured; skipping Cloudflare R2 cache publication."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.upload_gate.outputs.has_key == 'true'
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}

      - name: Download delta cache bundle from Build workflow
        if: steps.upload_gate.outputs.has_key == 'true'
        uses: actions/download-artifact@v4
        with:
          name: qatlib-cache-delta-${{ env.TARGET_SHA }}
          path: cache-staging
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate delta cache metadata
        id: meta
        if: steps.upload_gate.outputs.has_key == 'true'
        run: |
          set -euo pipefail
          python3 - "$TARGET_SHA" "$GITHUB_ENV" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          target_sha, gh_env, gh_out = sys.argv[1:]
          meta = json.loads(Path("cache-staging/metadata.json").read_text())
          assert meta["sha"] == target_sha, f"SHA mismatch: {meta['sha']} != {target_sha}"
          assert Path("cache-staging/full-outputs.jsonl").is_file(), "Missing full-outputs.jsonl"
          with open(gh_env, "a") as f:
              f.write(f"CACHE_SCOPE={meta['scope']}\n")
              f.write(f"INPUT_TREE={meta['input_tree']}\n")
          with open(gh_out, "a") as f:
              f.write(f"has_delta={'true' if meta['has_delta'] else 'false'}\n")
          PY

      - name: Install elan (only when new .ltar artifacts exist)
        if: steps.upload_gate.outputs.has_key == 'true' && steps.meta.outputs.has_delta == 'true'
        run: |
          set -o pipefail
          if command -v lake >/dev/null 2>&1; then
            lake --version
            exit 0
          fi
          ELAN_VERSION="v4.1.2"
          ELAN_SHA256="4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264"
          ELAN_SCRIPT="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/leanprover/elan/$ELAN_VERSION/elan-init.sh" \
            --output "$ELAN_SCRIPT"
          printf '%s  %s\n' "$ELAN_SHA256" "$ELAN_SCRIPT" | sha256sum --check --strict
          sh "$ELAN_SCRIPT" --default-toolchain none -y
          ~/.elan/bin/lake --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Publish delta artifacts and full revision manifest to Cloudflare R2
        if: steps.upload_gate.outputs.has_key == 'true'
        env:
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
          LAKE_CONFIG: ${{ github.workspace }}/lake-cache.toml
        run: |
          set -euo pipefail
          KEY="$(printf %s "$LAKE_CACHE_KEY_RAW" | sed -e 's/[[:space:]]*$//')"
          echo "::add-mask::$KEY"
          export LAKE_CACHE_KEY="$KEY"
          TC_RAW="$(tr -d '[:space:]' < lean-toolchain)"
          TC_DIR="$(printf %s "$TC_RAW" | sed -e 's|/|--|g' -e 's|:|---|g')"
          REPO_SLUG="quantum-atlas-ai/qatlib"
          S3_BASE="https://423d114d4989f5bc042102b9554f3eef.r2.cloudflarestorage.com/qatlib-cache/revisions/$REPO_SLUG/tc/$TC_DIR"
          if [ "${{ steps.meta.outputs.has_delta }}" = "true" ]; then
            lake cache put-staged cache-staging --repo="$REPO_SLUG" --toolchain="$TC_RAW" --rev="delta-$TARGET_SHA-${{ github.run_id }}"
          fi
          curl -fsS --retry 3 --retry-delay 1 -X PUT -T cache-staging/full-outputs.jsonl \
            -H "Content-Type: application/vnd.reservoir.outputs+json-lines" \
            --aws-sigv4 "aws:amz:auto:s3" --user "$KEY" "$S3_BASE/inputs/$INPUT_TREE.jsonl"
          curl -fsS --retry 3 --retry-delay 1 -X PUT -T cache-staging/full-outputs.jsonl \
            -H "Content-Type: application/vnd.reservoir.outputs+json-lines" \
            --aws-sigv4 "aws:amz:auto:s3" --user "$KEY" "$S3_BASE/$TARGET_SHA.jsonl"
