name: Cache

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      publish_cache:
        description: Publish verified cache on main after all mathematical checks pass
        type: boolean
        default: false
    secrets:
      LAKE_CACHE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      publish_cache:
        description: Publish verified cache on main after all mathematical checks pass
        type: boolean
        default: false

# This prefix differs from lint.yml's concurrency group, so a reusable
# workflow cannot cancel its own caller.
concurrency:
  group: qatlib-math-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qatlib:
    name: Build, audit, and optionally publish Qatlib cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
      LEAN_ABORT_ON_PANIC: "1"
      LEAN_NUM_THREADS: ${{ vars.QATLIB_CI_THREADS || '1' }}
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute cache scope and find a read-only R2 mapping candidate
        id: check_r2
        run: |
          set -euo pipefail
          TC="$(tr '/:' '--' < lean-toolchain | tr -d '[:space:]')"
          SCOPE="qatlib-main/$TC/qatlib"
          INPUT_TREE="$(git rev-parse HEAD:Qatlib HEAD:Qatlib.lean HEAD:lakefile.toml HEAD:lean-toolchain HEAD:lake-manifest.json | sha256sum | cut -d' ' -f1)"
          echo "CACHE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "INPUT_TREE=$INPUT_TREE" >> "$GITHUB_ENV"
          CDN_BASE="https://lake-cache.quantum-atlas.ai/revisions/$SCOPE"
          CANDIDATE="$RUNNER_TEMP/qatlib-cached-inputs.jsonl"
          echo "mapping=$CANDIDATE" >> "$GITHUB_OUTPUT"
          if curl -fsSL -H "User-Agent: LakeCache/4.35.0" "$CDN_BASE/${{ github.sha }}.jsonl" -o "$CANDIDATE" 2>/dev/null && [ -s "$CANDIDATE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsSL -H "User-Agent: LakeCache/4.35.0" "$CDN_BASE/inputs/$INPUT_TREE.jsonl" -o "$CANDIDATE" 2>/dev/null && [ -s "$CANDIDATE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for ANC in $(git rev-list --max-count=20 HEAD~1 2>/dev/null || true); do
            if git diff --quiet "$ANC" HEAD -- Qatlib/ Qatlib.lean lakefile.toml lean-toolchain lake-manifest.json && \
               curl -fsSL -H "User-Agent: LakeCache/4.35.0" "$CDN_BASE/$ANC.jsonl" -o "$CANDIDATE" 2>/dev/null && [ -s "$CANDIDATE" ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Install elan
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run static source, style, and layer checks
        run: lake lint

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          free -h
          nproc
          case "$LEAN_NUM_THREADS" in
            ''|*[!0-9]*) echo "QATLIB_CI_THREADS must be a positive integer"; exit 1 ;;
          esac
          test "$LEAN_NUM_THREADS" -gt 0
          printf 'LEAN_NUM_THREADS=%s\n' "$LEAN_NUM_THREADS"

      - name: Fetch Mathlib, Physlib, and Qatlib caches
        run: lake exe get_cache

      - name: Import the R2 mapping candidate locally
        if: steps.check_r2.outputs.found == 'true'
        env:
          LAKE_CONFIG: ${{ github.workspace }}/lake-cache.toml
        run: |
          set -euo pipefail
          lake cache get "${{ steps.check_r2.outputs.mapping }}" --package=Qatlib --scope="$CACHE_SCOPE"

      - name: Check whether all Qatlib artifacts already exist on R2
        id: warm
        run: |
          set -euo pipefail
          if [ "${{ steps.check_r2.outputs.found }}" = "true" ] && lake --no-build build -KCI Qatlib; then
            echo "manifest_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Qatlib incrementally and record current outputs
        id: build
        run: |
          set -euo pipefail
          lake build -KCI Qatlib -o .lake/outputs.jsonl | tee stdout.log
          test -s .lake/outputs.jsonl

      - name: Run kernel soundness and transitive axiom audit
        id: audit
        run: lake exe test

      # Credentials are considered only after source elaboration and the
      # kernel audit. Their absence skips uploads, never mathematical checks.
      - name: Check whether verified cache upload is enabled
        id: upload_gate
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          (github.event_name == 'push' || inputs.publish_cache)
        env:
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          set -euo pipefail
          KEY="$(printf %s "$LAKE_CACHE_KEY_RAW" | sed -e 's/[[:space:]]*$//')"
          echo "::add-mask::$KEY"
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No LAKE_CACHE_KEY; mathematical verification passed and cache upload is skipped."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage verified Qatlib outputs
        id: stage
        if: steps.upload_gate.outputs.has_key == 'true' && steps.build.outcome == 'success' && steps.audit.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p ../lake-cache-staging
          if [ "${{ steps.warm.outputs.manifest_only }}" = "true" ]; then
            cp .lake/outputs.jsonl ../lake-cache-staging/outputs.jsonl
          else
            lake cache stage .lake/outputs.jsonl ../lake-cache-staging
          fi

      - name: Publish verified cache to Cloudflare R2
        if: steps.upload_gate.outputs.has_key == 'true' && steps.stage.outcome == 'success' && steps.build.outcome == 'success' && steps.audit.outcome == 'success'
        env:
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
          LAKE_CONFIG: ${{ github.workspace }}/lake-cache.toml
        run: |
          set -euo pipefail
          KEY="$(printf %s "$LAKE_CACHE_KEY_RAW" | sed -e 's/[[:space:]]*$//')"
          echo "::add-mask::$KEY"
          export LAKE_CACHE_KEY="$KEY"
          S3_BASE="https://423d114d4989f5bc042102b9554f3eef.r2.cloudflarestorage.com/qatlib-cache/revisions/$CACHE_SCOPE"
          if [ "${{ steps.warm.outputs.manifest_only }}" = "true" ]; then
            curl -fsS -X PUT -T ../lake-cache-staging/outputs.jsonl \
              -H "Content-Type: application/vnd.reservoir.outputs+json-lines" \
              --aws-sigv4 "aws:amz:auto:s3" --user "$KEY" "$S3_BASE/${{ github.sha }}.jsonl"
          else
            lake cache put-staged ../lake-cache-staging --scope="$CACHE_SCOPE" --rev="${{ github.sha }}"
          fi
          curl -fsS -X PUT -T ../lake-cache-staging/outputs.jsonl \
            -H "Content-Type: application/vnd.reservoir.outputs+json-lines" \
            --aws-sigv4 "aws:amz:auto:s3" --user "$KEY" "$S3_BASE/inputs/$INPUT_TREE.jsonl"
