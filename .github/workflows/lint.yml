name: Lint

on:
  push:
    branches: [main, "bump/**"]
  pull_request:
    branches: [main, "bump/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Style & Import Linter
    runs-on: ${{ fromJSON(vars.QATLIB_LIGHT_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_CHECKOUT_DEPLOY_KEY }}

      - name: Install elan
        run: |
          set -o pipefail
          if command -v lean >/dev/null 2>&1 && command -v lake >/dev/null 2>&1; then
            lean --version
            lake --version
            exit 0
          fi
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run style and import checks
        run: |
          git diff --check
          lake lint
